name: LumaNAV OTA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumanav-ota-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish OTA APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::All four LumaNAV signing secrets must be configured. Refusing to publish an APK with a temporary signing key."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/lumanav-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent LumaNAV release signing key verified."

      - name: Build release APK
        run: |
          export LUMANAV_VERSION_CODE="$GITHUB_RUN_NUMBER"
          echo "LUMANAV_VERSION_CODE=$LUMANAV_VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Name APK and prepare release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="LumaNAV-${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%s >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          name: LumaNAV ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_meta.outputs.notes }}
          files: ${{ steps.release_meta.outputs.apk }}
          make_latest: true
