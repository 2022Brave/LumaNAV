name: LumaNAV Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - "feature/**"
      - "branding/**"
    paths:
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/release-ota.yml"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: write

concurrency:
  group: lumanav-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # On pull_request, github.ref_name is the synthetic '<number>/merge'
          # name, not a real branch. Check out the PR head commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package has been removed from the SDK
          # repository; setup-android defaults to requesting it.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The exported project did not contain gradlew, gradlew.bat or
      # gradle-wrapper.jar. Bootstrap the official wrapper once, then keep it
      # in this development branch so local and CI builds use the same Gradle.
      - name: Bootstrap Gradle Wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Build: add Gradle wrapper 9.3.1"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      # Use the same persistent signing identity for every installable CI APK.
      # Forked pull requests do not receive repository secrets, so retain a
      # disposable debug-key fallback only for those external PR builds.
      - name: Configure persistent signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_FILE="$RUNNER_TEMP/lumanav-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            {
              echo "KEYSTORE_PATH=$KEYSTORE_FILE"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent LumaNAV signing key configured."
          else
            echo "Repository signing secrets unavailable; generating a temporary key for this build."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/lumanav-ci-debug.jks" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/lumanav-ci-debug.jks"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          # Android versionCode is limited to 2,100,000,000. Use a shared,
          # UTC epoch-based sequence (10-second resolution) across dev/stable workflows.
          VERSION_CODE="$(($(date -u +%s) / 10))"
          echo "LUMANAV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          export LUMANAV_VERSION_CODE="$VERSION_CODE"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK signature and certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/ {print toupper($2); exit}' | tr -d ':')"
          EXPECTED="CB E B AF 3E 99 C5 7E 56 3F 0F 28 5E 6D 58 40 30 61 A7 D5 D1 C0 28 EE 18 78 92 3B CE BE FD 21 57"
          EXPECTED="$(printf '%s' "$EXPECTED" | tr -d ' :')"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "APK signing certificate does not match the permanent LumaNAV key."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "APK certificate fingerprint matches the permanent LumaNAV key."

      # Publish the APK immediately after a successful package build, so a
      # later test failure does not hide an installable debug build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumanav-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest


      # Publish every fully tested build from the personal development branch.
      # This is deliberately excluded from pull_request and manual runs.
      - name: Publish development OTA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/branding/lumanav-ui-overhaul'
        shell: bash
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          VERSION_CODE="$LUMANAV_VERSION_CODE"
          VERSION="1.0.${VERSION_CODE}"
          APK="LumaNAV-dev-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK=${APK}" >> "$GITHUB_ENV"
          echo "APK_URL=https://github.com/2022Brave/LumaNAV/releases/download/dev-${GITHUB_RUN_ID}/${APK}" >> "$GITHUB_ENV"
          printf '%s\n' "${COMMIT_SUBJECT}" > dev-release-notes.txt

      - name: Create development GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/branding/lumanav-ui-overhaul'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_id }}
          name: LumaNAV Development ${{ github.run_id }}
          body_path: dev-release-notes.txt
          files: LumaNAV-dev-*.apk
          prerelease: true
          make_latest: false

      - name: Publish development OTA manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/branding/lumanav-ui-overhaul'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          VERSION_CODE="$LUMANAV_VERSION_CODE"
          VERSION="1.0.${VERSION_CODE}"
          APK="LumaNAV-dev-${VERSION}.apk"
          APK_URL="https://github.com/2022Brave/LumaNAV/releases/download/dev-${GITHUB_RUN_ID}/${APK}"
          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION}" \
            --arg apkUrl "${APK_URL}" \
            --arg notes "${COMMIT_SUBJECT}" \
            --arg commit "${COMMIT_SHA}" \
            --arg channel "development" \
            --arg buildNumber "${GITHUB_RUN_NUMBER}" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,notes:$notes,commit:$commit,channel:$channel,buildNumber:$buildNumber}' \
            > latest-dev.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-dev.json
          git commit -m "Update development OTA manifest for ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumanav-test-reports-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
