name: LumaNAV OTA Release

on:
  # Releases are intentionally manual. A normal merge or push must never
  # publish an APK to the update channel.
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Explicitly authorize publishing a LumaNAV release"
        required: true
        type: choice
        options:
          - "no"
          - "publish"
        default: "no"

permissions:
  contents: write

concurrency:
  group: lumanav-ota-main
  cancel-in-progress: false

jobs:
  release:
    # Only allow deliberate releases from the protected default branch.
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == 'publish'
    name: Build and publish OTA APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::All four LumaNAV signing secrets must be configured. Refusing to publish an APK with a temporary signing key."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/lumanav-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent LumaNAV release signing key verified."

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          # The first release must be newer than the already-installed CI APK
          # (whose fallback versionCode is 1).
          # Share the same Android-safe monotonic sequence used by development CI.
          VERSION_CODE="$(($(date -u +%s) / 10))"
          export LUMANAV_VERSION_CODE="$VERSION_CODE"
          echo "LUMANAV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}' | tr -d ':')"
          EXPECTED="cbebaf3e99c57e563f0f285e6d58403061a7d5d1c028ee1878923bcebefd2157"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release APK certificate does not match the permanent LumaNAV key."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Release APK certificate matches the permanent LumaNAV key."

      - name: Name APK and prepare release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$LUMANAV_VERSION_CODE"
          VERSION="1.0.$VERSION_CODE"
          APK="LumaNAV-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%s >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          name: LumaNAV ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_meta.outputs.notes }}
          files: ${{ steps.release_meta.outputs.apk }}
          make_latest: true

      - name: Update raw OTA manifest
        shell: bash
        env:
          VERSION_NAME: ${{ steps.release_meta.outputs.version }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          APK_NAME: ${{ steps.release_meta.outputs.apk }}
          RELEASE_NOTES: ${{ steps.release_meta.outputs.notes }}
        run: |
          set -euo pipefail
          APK_URL="https://github.com/2022Brave/LumaNAV/releases/download/v${VERSION_NAME}/${APK_NAME}"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg notes "$RELEASE_NOTES" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,notes:$notes}' \
            > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OTA manifest for ${VERSION_NAME}"
            git push origin HEAD:main
          fi
