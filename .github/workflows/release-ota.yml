name: LumaNAV OTA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumanav-ota-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish OTA APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumanav-release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/lumanav-release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
              echo "USE_RELEASE_SIGNING=true"
            } >> "$GITHUB_ENV"
          else
            echo "Release keystore secrets not configured; using a runner-generated debug key for this bootstrap APK."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/lumanav-debug.jks" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/lumanav-debug.jks"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
              echo "USE_RELEASE_SIGNING=false"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          echo "LUMANAV_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Name APK and prepare release notes
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="LumaNAV-${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%s >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          name: LumaNAV ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_meta.outputs.notes }}
          files: ${{ steps.release_meta.outputs.apk }}
          make_latest: true
