name: Auvionyx Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - "feature/**"
    paths:
      - ".github/workflows/android-ci.yml"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: write

concurrency:
  group: auvionyx-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package has been removed from the SDK
          # repository; setup-android defaults to requesting it.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The exported project did not contain gradlew, gradlew.bat or
      # gradle-wrapper.jar. Bootstrap the official wrapper once, then keep it
      # in this development branch so local and CI builds use the same Gradle.
      - name: Bootstrap Gradle Wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Build: add Gradle wrapper 9.3.1"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Compile debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auvionyx-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auvionyx-test-reports-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
